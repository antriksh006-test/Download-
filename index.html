<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downloads</title>
  <meta name="description" content="Download files from my library">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow"></div>

  <main class="container">
    <header class="hero">
      <div>
        <span class="eyebrow">MY FILE LIBRARY</span>
        <h1>Downloads</h1>
        <p>Browse the library and download what you need.</p>
      </div>
      <div class="file-count" id="fileCount">0 files</div>
    </header>

    <section class="toolbar">
      <label class="search">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Search files..." autocomplete="off">
      </label>
      <button id="refresh" class="button secondary">Refresh</button>
    </section>

    <div id="status" class="status hidden"></div>
    <section id="fileList" class="file-list"></section>

    <footer>Fast downloads • S3 compatible storage</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
